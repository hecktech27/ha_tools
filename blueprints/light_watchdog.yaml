blueprint:
  name: Light Watchdog
  description: >
    Version 1.6


    Automatically turns off defined lights after a configurable timeout when no
    relevant activity is detected. The timeout resets on every state change of a
    trigger entity. If all lights are manually turned off beforehand, the automation
    ends without taking any action.
    No external helper required.
  domain: automation
  input:
    target_lights:
      name: Target Lights
      description: Lights to be monitored and turned off after the timeout.
      selector:
        entity:
          domain: light
          multiple: true

    trigger_entities:
      name: Trigger Entities (Sensors)
      description: >
        Entities whose state changes reset the timeout (e.g. door contacts,
        motion sensors). Can be left empty – the automation will then only react
        to light state changes.
      default: []
      selector:
        entity:
          multiple: true

    override_entity:
      name: Override Entity (optional)
      description: >
        If this entity is in the 'on' state, the automation will be aborted and
        the lights will not be turned off. E.g. an input_boolean or binary_sensor.
        Can be left empty.
      default: []
      selector:
        entity: {}

    timeout_duration:
      name: Timeout
      description: Time until automatic shut-off after the last detected activity.
      default:
        hours: 0
        minutes: 5
        seconds: 0
      selector:
        duration: {}

    optional_action:
      name: Optional Action After Turning Off
      description: >
        Executed after the lights have been automatically turned off.
        Available variables:
        - {{ lights_turned_off }} – List of entity IDs that were turned off
        - {{ timeout_total_seconds }} – Configured timeout in seconds
      default: []
      selector:
        action: {}

variables:
  blueprint_version: "1.6"
  target_lights_list: !input target_lights
  timeout_duration: !input timeout_duration
  override_entity: !input override_entity

mode: restart

trigger:
  - platform: state
    entity_id: !input target_lights
    to: "on"

condition:
  - condition: template
    value_template: >
      {{ expand(target_lights_list)
         | selectattr('state', 'eq', 'on')
         | list | count > 0 }}

action:
  - alias: "Watchdog loop – reset timer on activity"
    repeat:
      while:
        - condition: template
          value_template: >
            {{ expand(target_lights_list)
               | selectattr('state', 'eq', 'on')
               | list | count > 0 }}
      sequence:
        - alias: "Wait for timeout or reset event"
          wait_for_trigger:
            - platform: state
              entity_id: !input target_lights
              to: "off"
            - platform: state
              entity_id: !input trigger_entities
          timeout:
            hours: "{{ timeout_duration.hours | default(0) | int }}"
            minutes: "{{ timeout_duration.minutes | default(0) | int }}"
            seconds: "{{ timeout_duration.seconds | default(0) | int }}"
          continue_on_timeout: true

        - if:
            - condition: template
              value_template: "{{ wait.trigger == none }}"
          then:
            # Override check: abort if the override entity is 'on'
            - if:
                - condition: template
                  value_template: >
                    {{ override_entity != []
                       and states(override_entity) == 'on' }}
              then:
                - stop: "override_active"
            - variables:
                lights_turned_off: >
                  {{ expand(target_lights_list)
                     | selectattr('state', 'eq', 'on')
                     | map(attribute='entity_id')
                     | list }}
                timeout_total_seconds: >
                  {{ (timeout_duration.hours | default(0) | int) * 3600
                     + (timeout_duration.minutes | default(0) | int) * 60
                     + (timeout_duration.seconds | default(0) | int) }}
            - alias: "Turn off all targets"
              service: light.turn_off
              target:
                entity_id: !input target_lights
            - alias: "Optional action"
              sequence: !input optional_action
            - stop: "timeout_reached"
